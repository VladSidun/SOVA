name: Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run qa:release
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: git diff --check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: phase-8-qa
          path: |
            output/playwright/phase-8/
            test-results/
